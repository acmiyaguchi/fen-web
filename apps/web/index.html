<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>fen-web demo</title>
    <meta name="theme-color" content="#14171c" />
    <!-- Critical inline style: styles.css arrives via the JS module graph,
         so without this the first paint flashes the browser-default white. -->
    <style>
      html {
        background: #14171c;
        color-scheme: dark;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <span class="topbar-title">fen-web demo</span>
      <button id="fen-open-settings" type="button" class="topbar-settings">
        Settings
      </button>
    </header>

    <!-- BYO-key settings gate (shell chrome). The agent UI itself is
         rendered by the Fennel DOM presenter into #fen-app. -->
    <div id="fen-settings" class="settings-overlay"></div>

    <!-- Mount point for the DOM presenter (host.dom-apply builds its
         skeleton under this id; see apps/web/fnl/fen_web/web). -->
    <main id="fen-app" class="fen-app"></main>

    <!-- Shell-owned workspace visibility panel. It reads the durable `fs:`
         keyspace directly and never enters the VM/coroutine path. -->
    <aside id="fen-workspace" class="fen-workspace"></aside>

    <!-- Mount point for the sandboxed preview iframe (host.preview creates
         the <iframe sandbox="allow-scripts"> under this id; fen-web#8). The
         agent renders the IndexedDB app tree here and drives it over a
         postMessage RPC — never with allow-same-origin. -->
    <aside id="fen-preview" class="fen-preview"></aside>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
