name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install npm dependencies
        run: nix develop -c npm ci

      - name: Build workspaces
        run: nix develop -c npm run build

      - name: Run workspace tests (node:test)
        run: nix develop -c npm test

      - name: Run Fennel tests (Busted, bindings)
        run: >
          nix develop -c busted --loaders=lua,fennel
          --helper=packages/bindings/tests/helper.lua --pattern=_test
          packages/bindings/tests

      - name: Run Fennel tests (Busted, platform)
        run: >
          nix develop -c busted --loaders=lua,fennel
          --helper=packages/platform/tests/helper.lua --pattern=_test
          packages/platform/tests

      - name: Run Fennel tests (Busted, web presenter)
        run: >
          nix develop -c busted --loaders=lua,fennel
          --helper=apps/web/tests/helper.lua --pattern=_test
          apps/web/tests

  e2e:
    name: Playwright e2e (Chromium)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install npm dependencies
        run: nix develop -c npm ci

      - name: Install Playwright Chromium
        run: nix develop -c npx playwright install --with-deps chromium

      - name: Run browser e2e suite
        run: nix develop -c npm run e2e -w @fen-web/e2e

      - name: Upload Playwright traces and report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-results
          path: |
            packages/e2e/test-results
            packages/e2e/playwright-report
          if-no-files-found: ignore
